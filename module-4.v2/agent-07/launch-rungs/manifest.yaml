# launch-rungs — parallel divergent subagent manifest
#
# Each entry below fans out as an isolated Claude Code session (or other harness)
# at the start of the run, constrained to a different structural rung. The
# orchestrator agent (your main session) reads each subagent's final
# models/<name>/predict.py via the iterate skill, picks the dev-CV winner, and
# proceeds from there.
#
# Why fan out: m3.v2 + m3.v3 both showed that single agents tend to refine
# whatever rung they started on. Forcing structural diversity via parallelism
# is the only mechanically-reliable way to ensure the cohort generates evidence
# about rungs higher than 0. Source: arXiv 2509.22480 (structured divergence)
# + Anthropic's multi-agent research blueprint (90.2% lift via context-isolated
# subagents on the same task).

orchestrator:
  model: claude-opus-4-7
  budget_minutes: 45
  # The orchestrator reads RESEARCH.md + PLAN.md (if RPI is used) and picks the
  # winner via dev-CV pooled score. Picks are made on the score, not on
  # agent self-assessment.

subagents:
  - name: rung-0-polish
    rung: 0
    starting_model: v1
    prompt_hint: |
      Refine V1 with cohort-evidenced low-risk moves:
      - per-platform additive bias (Mach-E, IONIQ-5) — see m4-cohort-findings.md §2
      - drop steering-rate feedforward as a lever — §3 shows it collapses
      Budget: 25 min. Ship models/rung-0-polish/.
    budget_minutes: 25

  - name: rung-0-orth-residual-learner
    rung: orthogonal
    starting_model: v1
    prompt_hint: |
      Ridge or GB head on V1's residual — cohort §4 evidence: +1-5% CTE
      reliably. Use 7-feature ridge first; if dev CV says R² > 0.2, try GB.
      MUST use route-grouped CV — agent-07 cohort §6: small-subset fits
      flip Lightning's sign.
    budget_minutes: 25

  - name: rung-1-dynamic-st-fit
    rung: 1
    starting_model: v1
    prompt_hint: |
      Linear dynamic single-track from _shared/rung1_starter.py.
      CRITICAL — cohort §1 + §7: do NOT use carParams C_α / Iz values.
      Fit {C_αf, C_αr, Iz} per platform against pooled yaw RMSE on dev with
      bounds. Use route-grouped CV. Inspect identifiability — if the fit
      collapses C_αf/C_αr to a ratio, the data lacks excitation; shelve and
      report why instead of forcing a fit.
    budget_minutes: 30

  - name: rung-1-regime-switched
    rung: 1
    starting_model: v1
    prompt_hint: |
      Regime-switched: V1 below threshold (|v·yaw_pred| < 4), dynamic ST above.
      Threshold sensitivity is the main risk — fit threshold + dyn-ST params
      jointly, with route-grouped CV. Cohort §8 implies the residual lives in
      a nonlinear feature space; the gate should expose where the switch helps.
    budget_minutes: 30

# Convergence: after all subagents return their final models/<name>/predict.py,
# the orchestrator runs `iterate` on each, reads MODELS.md + TREE.json, and
# either ships the leader or seeds a 2nd-round of subagents focused on the
# leading branch.
