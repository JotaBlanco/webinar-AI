name: Deploy webinar presentation to Pages

# Publishes the slide deck (webinar-presentation/) at the site root and the
# public webinar microsite (webinar-offline/site/) at /masterclass/. Nothing
# else (cohort-runs eval artifacts, module data) is published.

on:
  push:
    branches: [main]
    paths:
      - 'webinar-presentation/**'
      - 'webinar-offline/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage presentation as site root
        run: |
          mkdir -p _site
          cp -r webinar-presentation/. _site/
          # Make the bare Pages URL land on the slide index (relative links are
          # preserved because index.html sits at the same level as the deck).
          cp _site/presentation-index.html _site/index.html

      - name: Stage webinar microsite at /masterclass/
        run: |
          mkdir -p _site/masterclass
          cp -r webinar-offline/site/. _site/masterclass/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (source = GitHub Actions) on first run instead of
          # requiring a manual toggle in repo Settings.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
