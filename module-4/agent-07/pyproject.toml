[project]
name = "webinar-template"
version = "0.1.0"
description = "Reusable substrate template for AI-axis webinar demos. Replace with your project metadata after copying."
requires-python = ">=3.11"
dependencies = [
    # Add your project's runtime dependencies here.
    # The hello-world demo needs nothing beyond stdlib.
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
inspector = [
    # Dependencies for the context-window inspector under _stage/02-empathy/inspector/.
    # Uncomment when you implement the inspector.
    # "anthropic",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
